# ─────────────────────────────────────────────────────────────
# G1 보행 파라미터 (교재 4.3 파라미터 실험용)
#
# 사용:  python3 examples/01_walk_demo.py --params config/gait_params.yaml
# 원칙:  한 번에 하나만 바꾸고, 기본값으로 되돌린 뒤 다음으로 (교재 4.3)
# 기록:  바꾼 값 → 걸음이 어떻게 달라졌는지 → 넘어졌다면 어느 방향으로
# ─────────────────────────────────────────────────────────────

vx: 0.10           # 전진 속도 명령 [m/s]   (+앞 / −뒤)
vy: 0.0            # 횡이동 속도 [m/s]      (+왼쪽)
vyaw: 0.0          # 회전 속도 [rad/s]      (+반시계) ※ 제자리 회전 권장
step_period: 0.45  # 걸음 주기(왼발+오른발 1사이클) [s]
step_height: 0.04  # 유각(스윙) 발 들어올림 높이 [m]
com_shift: 0.045   # 좌우 무게중심 이동 폭 [m]
pelvis_height: 0.755  # 보행 중 골반 높이 [m]
arm_swing: 0.12    # 보행 팔 스윙 진폭 [rad]  (0 이면 팔 고정)
